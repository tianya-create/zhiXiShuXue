<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#516171"/></marker>
    <style>
      .title{font:700 30px 'Microsoft YaHei',sans-serif;fill:#17283d}.box-title{font:700 19px 'Microsoft YaHei',sans-serif;fill:#17283d}.body{font:15px 'Microsoft YaHei',sans-serif;fill:#33465b}.line{fill:none;stroke:#516171;stroke-width:2.4;marker-end:url(#arrow)}.label{font:14px 'Microsoft YaHei',sans-serif;fill:#516171}
    </style>
  </defs>
  <rect width="1400" height="850" fill="#fbfcfe"/>
  <text x="700" y="55" text-anchor="middle" class="title">智析数学认知心理双层学情适配架构</text>
  <g id="student"><rect x="55" y="145" rx="18" width="220" height="210" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="165" y="182" text-anchor="middle" class="box-title">学生端</text><text x="82" y="218" class="body"><tspan x="82" dy="0">薄弱练习入口</tspan><tspan x="82" dy="28">同知识点 5 题任务包</tspan><tspan x="82" dy="28">VARK 问卷与结果</tspan><tspan x="82" dy="28">轮后自评与心理便利贴</tspan><tspan x="82" dy="28">主动求助</tspan></text></g>
  <g id="api"><rect x="345" y="145" rx="18" width="220" height="210" fill="#f2f4f7" stroke="#65717f" stroke-width="2"/><text x="455" y="182" text-anchor="middle" class="box-title">API 与权限层</text><text x="372" y="218" class="body"><tspan x="372" dy="0">学生安全 DTO</tspan><tspan x="372" dy="28">教师班级归属校验</tspan><tspan x="372" dy="28">管理员角色校验</tspan><tspan x="372" dy="28">请求幂等与事务</tspan><tspan x="372" dy="28">题目白名单校验</tspan></text></g>
  <g id="l1"><rect x="640" y="115" rx="18" width="250" height="250" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="765" y="154" text-anchor="middle" class="box-title">第一层 任务复杂度</text><text x="670" y="193" class="body"><tspan x="670" dy="0">本轮正确率</tspan><tspan x="670" dy="28">题目认知负荷</tspan><tspan x="670" dy="28">学业控制感</tspan><tspan x="670" dy="28">感知认知负荷</tspan><tspan x="670" dy="28">强制降级与单级调整</tspan><tspan x="670" dy="28">支架与页面密度</tspan></text></g>
  <g id="l2"><rect x="970" y="115" rx="18" width="250" height="250" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="1095" y="154" text-anchor="middle" class="box-title">第二层 VARK 资源</text><text x="1000" y="193" class="body"><tspan x="1000" dy="0">V 视觉图示</tspan><tspan x="1000" dy="28">A 听觉音频</tspan><tspan x="1000" dy="28">R 文字推导</tspan><tspan x="1000" dy="28">K 实操试错</tspan><tspan x="1000" dy="28">单通道或双通道</tspan><tspan x="1000" dy="28">不改变第一层难度</tspan></text></g>
  <g id="db"><rect x="260" y="510" rx="18" width="330" height="250" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="425" y="548" text-anchor="middle" class="box-title">SQLite 数据层</text><text x="295" y="585" class="body"><tspan x="295" dy="0">questions</tspan><tspan x="295" dy="25">varkAssessments</tspan><tspan x="295" dy="25">learningRounds</tspan><tspan x="295" dy="25">controlAssessments</tspan><tspan x="295" dy="25">adaptationDecisions</tspan><tspan x="295" dy="25">presentationEvidence</tspan><tspan x="295" dy="25">teacherSupportRequests</tspan></text></g>
  <g id="config"><rect x="670" y="535" rx="18" width="220" height="200" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="780" y="573" text-anchor="middle" class="box-title">统一配置</text><text x="700" y="610" class="body"><tspan x="700" dy="0">白名单知识点</tspan><tspan x="700" dy="27">VARK 每次练习必测</tspan><tspan x="700" dy="27">量表阈值</tspan><tspan x="700" dy="27">规则版本</tspan><tspan x="700" dy="27">便利贴文案</tspan></text></g>
  <g id="staff"><rect x="990" y="505" rx="18" width="260" height="240" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1120" y="544" text-anchor="middle" class="box-title">教师端与管理端</text><text x="1020" y="582" class="body"><tspan x="1020" dy="0">班级分布统计</tspan><tspan x="1020" dy="28">学生适配档案</tspan><tspan x="1020" dy="28">主动求助</tspan><tspan x="1020" dy="28">题库认知负荷</tspan><tspan x="1020" dy="28">规则配置</tspan><tspan x="1020" dy="28">授权范围内历史记录</tspan></text></g>
  <path d="M275 250 H345" class="line"/><path d="M565 250 H640" class="line"/><path d="M890 240 H970" class="line"/><text x="930" y="225" text-anchor="middle" class="label">先确定任务</text>
  <path d="M1095 365 V425 H165 V355" class="line"/><text x="650" y="414" text-anchor="middle" class="label">组装完成的学习页面进入下一轮</text>
  <path d="M455 355 V510" class="line"/><path d="M590 635 H625 V790 H955 V635 H990" class="line"/><text x="790" y="815" text-anchor="middle" class="label">统计与历史</text>
  <path d="M780 535 V365" class="line"/><path d="M890 635 H940 V320 H970" class="line"/>
</svg>
